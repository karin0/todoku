[package]
name = "todoku"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = "0.40"
ureq = { version = "3", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
anyhow = { version = "1", features = ["backtrace"] }
ctrlc = { version = "3", features = ["termination"] }
html-escape = "0.2"
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[features]
default = ["tls"]
tls = ["ureq/rustls"]
