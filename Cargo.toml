[package]
name = "todoku"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = "0.40"
kuriero = { git = "https://github.com/karin0/kuriero.git", rev = "4de0447dbbdf83f85203ff46dd7d0bc8ad447192", default-features = false }
serde = { version = "1", features = ["derive"] }
anyhow = { version = "1", features = ["backtrace"] }
ctrlc = { version = "3", features = ["termination"] }
html-escape = "0.2"
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[features]
default = ["tls"]
tls = ["kuriero/rustls"]

[lints.rust]
warnings = 'deny'

[lints.clippy]
pedantic = { level = 'warn', priority = -1 }
